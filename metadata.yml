Title: FASTSOLV solubility prediction
Description: Predicts how readily a solute dissolves in each of fifteen common organic
  solvents, reported as log molar solubility at 298 K. Attia, Burns and colleagues
  trained FASTSOLV on the BigSolDB measurement collection using fixed Mordred descriptors
  rather than a learned representation, and tested it by holding out whole solutes,
  where it extrapolated two to three times more accurately than the previous best
  model and approached the aleatoric limit of 0.5 to 1 log units set by disagreement
  between laboratories. The underlying model accepts any temperature, Ersilia fixes
  it at 298 K.
